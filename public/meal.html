<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFood // Dettagli Piatto</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <!-- Header & Top Bar iniettati da utils.js -->
    <div id="app-header"></div>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="container-fluid px-3 px-md-4 py-5" style="max-width: 1200px; min-height: 70vh;">
      
      <!-- Torna al Catalogo -->
      <div class="mb-4">
        <a href="catalog.html" class="text-dark small fw-bold text-decoration-none text-uppercase">
          <i class="bi bi-arrow-left me-1"></i> <span id="txt-back-catalog">Torna al Menu Completo</span>
        </a>
      </div>

      <!-- Scheda Piatto Dinamica -->
      <div id="meal-detail-container" class="row g-4 g-lg-5 align-items-start">
        <div class="col-12 text-center py-5 text-muted small" id="meal-loading">
          CARICAMENTO DETTAGLI PIATTO...
        </div>
      </div>

    </main>

    <!-- Componenti Comuni iniettati da utils.js -->
    <div id="app-footer"></div>
    <div id="app-drawer"></div>
    <div id="app-modals"></div>

    <!-- SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/meal.js"></script>
  </body>
</html>
