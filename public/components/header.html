<!-- TOP ANNOUNCEMENT BAR -->
<div class="top-bar text-center" id="txt-announcement">
  Supporto in Chat 24/7 &bull; Ordini al Bancone & Asporto Rapido   <!--bull punto elenco separatore-->
</div>

<!-- HEADER PRINCIPALE -->
<header class="main-header">  
  <div class="container-fluid px-3 px-md-4 py-3"> <!--padding p x larghezza y altezza, px md 4 responsive se il sito [ di taglia media aumenta di 4 il padding-->
    <div class="d-flex justify-content-between align-items-center"> <!-- d-flex figli uno accanto all'altro, primo figlio a destra e gli altri a sinistra-->
      
      <!-- Logo FastFood -->
      <div>
        <a href="index.html" class="brand-logo">FastFood</a>  <!--primo figlio-->
      </div>

      <!-- Strumenti a destra -->
      <div class="d-flex align-items-center gap-3"> <!--secondo figlio -> contenitore per i pulsanti a destra-->
        <button class="lang-switch-btn" id="lang-btn" onclick="toggleLanguage()">IT 🇮🇹</button>

        <button class="btn p-0 border-0 header-tools-link position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" aria-controls="cartOffcanvas" title="Carrello">
          <!--punto di ancoraggio che apre in drawer laterale cioe il carrello-->
          <i class="bi bi-box-seam fs-5"></i> <!--icona vettoriale della scatola d'asporto-->
          <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-black" style="font-size: 0.6rem;">0</span>
          <!--badge che conta i piatti-->
        </button>

        <button class="btn p-0 border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenuDrawer"> <!--bottone hamburger-->
          <i class="bi bi-list fs-4"></i>
        </button>
      </div>

    </div>
  </div>
</header>
