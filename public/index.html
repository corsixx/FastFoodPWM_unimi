<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFood // Official Store</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <!-- Header Iniettato da utils.js -->
    <div id="app-header"></div>

    <!-- Barra Categorie Sotto Header -->
    <div class="categories-bar-wrapper">
      <nav class="categories-scroll-container" id="categories-nav">
        <button class="nav-category-link active" onclick="filterCategory('', this)" id="btn-cat-all">ALL / TUTTO</button>
      </nav>
    </div>

    <!-- HERO LOOKBOOK -->
    <section class="hero-lookbook">
      <div class="lookbook-panel">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80" alt="Burger">
      </div>
      <div class="lookbook-panel">
        <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=800&q=80" alt="Pasta">
        <div class="lookbook-center-content">
          <span class="lookbook-badge" id="txt-hero-badge">CATALOGO PIATTI</span>
          <h2>FASTFOOD</h2>
          <a href="catalog.html" class="lookbook-cta-btn" id="txt-hero-cta">SCOPRI IL MENU COMPLETO &rarr;</a>
        </div>
      </div>
      <div class="lookbook-panel d-none d-sm-block">
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=800&q=80" alt="Pizza">
      </div>
      <div class="lookbook-panel d-none d-md-block">
        <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80" alt="Bowl">
      </div>
    </section>

    <!-- CONTENUTO PRINCIPALE (GRIGLIA DINAMICA ADATTIVA) -->
    <main class="container-fluid px-3 px-md-4 py-5" id="catalog-section">

      <!-- Intestazione Sezione Dinamica -->
      <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
        <div>
          <span class="badge bg-black text-white rounded-0 text-uppercase py-1 px-2 mb-1" id="home-section-badge" style="font-size: 0.65rem;">
            SCOPRI I PIATTI
          </span>
          <h5 class="text-uppercase fw-bold m-0" style="letter-spacing: 0.05em; font-family: 'Space Grotesk', sans-serif;" id="txt-popular-title">
            I PIÙ POPOLARI
          </h5>
          <div class="small text-muted" id="user-pref-label"></div>
        </div>
        <div>
          <a href="catalog.html" class="text-dark small fw-bold text-decoration-underline text-uppercase" id="txt-view-all">
            Vedi Tutto il Menu &rarr;
          </a>
        </div>
      </div>

      <!-- Griglia Prodotti -->
      <div class="row g-3 g-md-4" id="meals-grid">
        <div class="col-12 text-center py-5 text-muted small">
          <div class="spinner-border spinner-border-sm me-2"></div>Caricamento piatti in corso...
        </div>
      </div>

    </main>

    <!-- Componenti Comuni Iniettati da utils.js -->
    <div id="app-footer"></div>
    <div id="app-drawer"></div>
    <div id="app-modals"></div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
