<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fastfood® // official store</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- Stile 5mc2 Custom -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1. TOP ANNOUNCEMENT BAR -->
  <div class="top-bar text-center">
    Supporto in Chat 24/7 &bull; Consegna Rapida &bull; Ritiro al Bancone
  </div>

  <!-- 2. MAIN HEADER (Logo, Tools, Barra Categorie) -->
  <header class="main-header">
    <div class="container-fluid px-3 px-md-4 py-3">
      <div class="d-flex justify-content-between align-items-center">
        
        <!-- Logo -->
        <a href="index.html" class="brand-logo">fastfood<span>®</span></a>

        <!-- Tools Destra -->
        <div class="d-flex align-items-center gap-3">
          <span class="header-tools-link d-none d-sm-flex">🇮🇹 EUR €</span>
          <a class="header-tools-link" onclick="focusSearch()">CERCA</a>
          <a href="orders.html" class="header-tools-link position-relative">
            <i class="bi bi-box-seam fs-5"></i>
            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-black" style="font-size: 0.6rem;">0</span>
          </a>
          <button class="btn p-0 border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenuDrawer">
            <i class="bi bi-list fs-3"></i>
          </button>
        </div>

      </div>
    </div>

    <!-- Barra Categorie Orizzontale Scrollabile -->
    <div class="categories-bar-wrapper">
      <div class="container-fluid px-3 px-md-4">
        <nav class="categories-scroll-container" id="categories-nav">
          <button class="nav-category-link active" onclick="filterCategory('', this)">ALL / TUTTO</button>
          <button class="nav-category-link" onclick="filterCategory('Beef', this)">BURGER & MEAT</button>
          <button class="nav-category-link" onclick="filterCategory('Pasta', this)">PASTA</button>
          <button class="nav-category-link" onclick="filterCategory('Pizza', this)">PIZZA</button>
          <button class="nav-category-link" onclick="filterCategory('Chicken', this)">CHICKEN</button>
          <button class="nav-category-link" onclick="filterCategory('Vegetarian', this)">VEGAN & VEG</button>
          <button class="nav-category-link" onclick="filterCategory('Seafood', this)">SEAFOOD</button>
          <button class="nav-category-link" onclick="filterCategory('Side', this)">SIDES & SNACKS</button>
          <button class="nav-category-link" onclick="filterCategory('Dessert', this)">DESSERT</button>
        </nav>
      </div>
    </div>
  </header>

  <!-- 3. HERO LOOKBOOK (Multi-Panel) -->
  <section class="hero-lookbook d-flex">
    <div class="lookbook-panel">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80" alt="Smash Burger">
    </div>
    <div class="lookbook-panel">
      <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=800&q=80" alt="Fresh Pasta">
      <div class="lookbook-overlay-text">
        <span class="small text-uppercase fw-bold" style="letter-spacing: 0.2em;">SS26 FIRST DELIVERY</span>
        <h2>FAST TASTE</h2>
      </div>
    </div>
    <div class="lookbook-panel d-none d-sm-block">
      <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=800&q=80" alt="Pizza">
    </div>
    <div class="lookbook-panel d-none d-md-block">
      <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80" alt="Vegan Salad">
    </div>
  </section>

  <!-- 4. CATALOGO PRODOTTI -->
  <main class="container-fluid px-3 px-md-4 py-5" id="catalog-section">

    <!-- BACHECA CONSIGLIATI (Solo per clienti con preferenze) -->
    <section id="recommendations-wrapper" class="mb-5 d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="text-uppercase fw-bold m-0" style="letter-spacing: 0.05em;">SCELTI PER TE (IN BACHECA)</h6>
        <span class="small text-muted" id="user-pref-label"></span>
      </div>
      <div class="row g-3" id="recommendations-container"></div>
      <hr class="my-5" style="border-color: var(--ff-border);">
    </section>

    <!-- INTESTAZIONE CATALOGO & CERCA -->
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div>
        <h6 class="text-uppercase fw-bold m-0" style="letter-spacing: 0.05em;">NEW IN / CATALOGO</h6>
      </div>
      <div style="max-width: 250px;">
        <input type="text" id="search-box" class="form-control form-control-sm rounded-0 border-dark" placeholder="Cerca piatto..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <!-- GRIGLIA PIATTI -->
    <div class="row g-3 g-md-4" id="meals-grid">
      <!-- Inseriti da app.js -->
    </div>

  </main>

  <!-- 5. OFFCANVAS / DRAWER LATERALE -->
  <div class="offcanvas offcanvas-end offcanvas-5mc2" tabindex="-1" id="sideMenuDrawer">
    <div class="offcanvas-header justify-content-end pb-0">
      <button type="button" class="btn-close text-reset shadow-none" data-bs-dismiss="offcanvas"></button>
    </div>
    
    <div class="offcanvas-body d-flex flex-column justify-content-between pt-0">
      <div>
        <a href="index.html" class="drawer-nav-item">CATALOGO COMPLETO <i class="bi bi-chevron-right small"></i></a>
        <a href="orders.html" class="drawer-nav-item" id="drawer-orders-link">I MIEI ORDINI <i class="bi bi-chevron-right small"></i></a>
        <a href="stats.html" class="drawer-nav-item d-none" id="drawer-stats-link">STATISTICHE LOCALE <i class="bi bi-chevron-right small"></i></a>
        
        <div class="mt-4 pt-3">
          <input type="email" class="form-control rounded-0 border-dark mb-2 py-2" placeholder="la_tua@email.it">
          <button class="btn btn-black">ISCRIVITI AL CANALE DROPS</button>
        </div>
      </div>

      <div class="border-top pt-3 mt-4" id="drawer-user-section"></div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Script JS -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
