<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fastfood® // official webstore</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons per carrello e menu -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- CSS 5mc2 Style -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1. TOP ANNOUNCEMENT BAR GIALLA -->
  <div class="top-bar text-center">
    Supporto Ordini in Chat 24/7 &bull; Ritiro al Bancone Espresso
  </div>

  <!-- 2. NAVBAR MINIMAL -->
  <header class="main-header py-3">
    <div class="container-fluid px-4">
      <div class="row align-items-center">
        
        <!-- Logo Sinistra -->
        <div class="col-3 col-md-2">
          <a href="index.html" class="brand-logo">fastfood<span>®</span></a>
        </div>

        <!-- Menu Categorie Centrale (Desktop) -->
        <div class="col-6 col-md-8 text-center d-none d-lg-block">
          <a href="#" class="nav-category-link active" onclick="filterCategory('')">TUTTO</a>
          <a href="#" class="nav-category-link" onclick="filterCategory('Beef')">BURGER</a>
          <a href="#" class="nav-category-link" onclick="filterCategory('Pasta')">PASTA</a>
          <a href="#" class="nav-category-link" onclick="filterCategory('Vegetarian')">VEGAN</a>
          <a href="#" class="nav-category-link" onclick="filterCategory('Dessert')">DESSERT</a>
          <a href="#" class="nav-category-link" onclick="filterCategory('Side')">CONTORNI</a>
        </div>

        <!-- Tool Destra (Valuta, Cerca, Carrello, Drawer) -->
        <div class="col-9 col-md-2 d-flex justify-content-end align-items-center gap-3">
          <span class="header-tools-link d-none d-sm-flex">🇮🇹 EUR €</span>
          <a href="#search-section" class="header-tools-link" onclick="focusSearch()">CERCA</a>
          <a href="orders.html" class="header-tools-link position-relative">
            <i class="bi bi-box-seam fs-5"></i>
            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-black" style="font-size: 0.6rem;">0</span>
          </a>
          <!-- Tasto Hamburger che apre il Drawer laterale -->
          <button class="btn p-0 border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenuDrawer">
            <i class="bi bi-list fs-3"></i>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- 3. HERO / LOOKBOOK MULTI-PANEL -->
  <section class="hero-lookbook d-none d-md-flex">
    <div class="lookbook-panel">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80" alt="Smash Burger">
    </div>
    <div class="lookbook-panel">
      <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=800&q=80" alt="Fresh Pasta">
      <div class="lookbook-overlay-text">
        <span class="small text-uppercase font-weight-bold" style="letter-spacing: 0.2em;">SS26 FIRST DELIVERY</span>
        <h2>FAST TASTE</h2>
        <a href="#catalog" class="text-white text-decoration-underline small font-weight-bold">ORDINA ORA</a>
      </div>
    </div>
    <div class="lookbook-panel">
      <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=800&q=80" alt="Artisan Pizza">
    </div>
    <div class="lookbook-panel">
      <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80" alt="Green Bowl">
    </div>
  </section>

  <!-- 4. CONTENUTO: SEZIONE "NEW IN" & CATALOGO -->
  <main class="container-fluid px-4 py-5" id="catalog">

    <!-- BACHECA CONSIGLIATI (SE CLIENTE AUTENTICATO) -->
    <section id="recommendations-wrapper" class="mb-5 d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="text-uppercase fw-bold m-0" style="letter-spacing: 0.05em;">SCELTI PER TE (IN BACHECA)</h6>
        <span class="small text-muted" id="user-pref-label">Preferenza: -</span>
      </div>
      <div class="row g-3" id="recommendations-container">
        <!-- Generato da JS -->
      </div>
      <hr class="my-5" style="border-color: var(--ff-border);">
    </section>

    <!-- HEADER SEZIONE CATALOGO -->
    <div class="d-flex justify-content-between align-items-end mb-4" id="search-section">
      <div>
        <h6 class="text-uppercase fw-bold m-0" style="letter-spacing: 0.05em;">NEW IN / CATALOGO</h6>
      </div>
      <div class="d-flex gap-2">
        <input type="text" id="search-box" class="form-control form-control-sm rounded-0 border-dark" placeholder="Cerca ricetta..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <!-- GRIGLIA PRODOTTI -->
    <div class="row g-4" id="meals-grid">
      <!-- Card popolate dinamicamente -->
    </div>

  </main>

  <!-- 5. OFFCANVAS / DRAWER LATERALE (IDENTICO ALLA SECONDA FOTO) -->
  <div class="offcanvas offcanvas-end offcanvas-5mc2" tabindex="-1" id="sideMenuDrawer">
    <div class="offcanvas-header justify-content-end pb-0">
      <button type="button" class="btn-close text-reset shadow-none" data-bs-dismiss="offcanvas"></button>
    </div>
    
    <div class="offcanvas-body d-flex flex-column justify-content-between pt-0">
      <div>
        <!-- Link Navigazione Accordion-style -->
        <a href="index.html" class="drawer-nav-item">MENU COMPLETO <i class="bi bi-chevron-right small"></i></a>
        <a href="orders.html" class="drawer-nav-item" id="drawer-orders-link">I MIEI ORDINI <i class="bi bi-chevron-right small"></i></a>
        <a href="stats.html" class="drawer-nav-item d-none" id="drawer-stats-link">STATISTICHE VENDITE <i class="bi bi-chevron-right small"></i></a>
        
        <!-- Box Newsletter -->
        <div class="mt-4 pt-3">
          <input type="email" class="form-control rounded-0 border-dark mb-2 py-2" placeholder="la_tua@email.it">
          <button class="btn btn-black">ISCRIVITI PER PROMOZIONI</button>
        </div>
      </div>

      <!-- Footer del Drawer (Account & Logout) -->
      <div class="border-top pt-3 mt-4" id="drawer-user-section">
        <!-- Inserito dinamicamente da JS (Login o Profilo) -->
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- App JS -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
