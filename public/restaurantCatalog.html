<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFood // Catalogo Ristoranti Partner</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <!-- Componenti Comuni Iniettati da utils.js -->
    <div id="app-header"></div>

    <!-- CONTENUTO PRINCIPALE RISTORANTI -->
    <main class="container-fluid px-3 px-md-4 py-5" style="max-width: 1400px; min-height: 75vh;">
      
      <!-- INTESTAZIONE CON SEARCH -->
      <div class="row g-3 align-items-center justify-content-between mb-4 pb-3 border-bottom">
        <div class="col-12 col-md-5">
          <h5 class="text-uppercase fw-bold m-0" style="letter-spacing: 0.05em;" id="txt-rest-title">I NOSTRI RISTORANTI PARTNER</h5>
          <span class="small text-muted" id="results-count">Caricamento locali in corso...</span>
        </div>

        <div class="col-12 col-md-7 d-flex gap-2 justify-content-md-end">
          <div class="input-group input-group-sm" style="max-width: 320px;">
            <span class="input-group-text bg-white border-dark rounded-0"><i class="bi bi-search"></i></span>
            <input type="text" id="search-input" class="form-control rounded-0 border-dark shadow-none" placeholder="Cerca ristorante o cucina..." oninput="handleSearch(this.value)">
          </div>
        </div>
      </div>

      <!-- GRIGLIA RISTORANTI (8 PER PAGINA) -->
      <div class="row g-3 g-md-4" id="restaurants-grid"></div>

      <!-- CONTROLLO PAGINAZIONE CON FRECCETTE -->
      <div class="d-flex justify-content-center align-items-center mt-5" id="pagination-wrapper">
        <div class="d-flex align-items-center gap-2" id="pagination-controls"></div>
      </div>

    </main>

    <!-- Componenti Comuni Iniettati da utils.js -->
    <div id="app-footer"></div>
    <div id="app-drawer"></div>
    <div id="app-modals"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/restaurantCatalog.js"></script>
  </body>
</html>
