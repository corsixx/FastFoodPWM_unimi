<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFood // Registrazione</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <!-- Header Iniettato da utils.js -->
    <div id="app-header"></div>

    <!-- CONTENUTO REGISTRAZIONE -->
    <main class="container py-5" style="max-width: 520px; min-height: 65vh;">
      <div class="border border-dark p-4 p-md-5 bg-white">
        
        <div class="text-center mb-4">
          <span class="badge bg-black rounded-0 text-uppercase py-1 px-2 mb-2" id="txt-badge-auth">CREA UN ACCOUNT</span>
          <h3 class="fw-bold text-uppercase m-0" style="font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em;" id="txt-register-title">
            REGISTRATI
          </h3>
          <p class="small text-muted mt-1" id="txt-register-sub">
            Crea il tuo profilo cliente o unisciti come ristorante partner
          </p>
        </div>

        <!-- Alert Messaggi -->
        <div id="register-alert" class="alert alert-danger rounded-0 small d-none py-2 px-3 mb-3"></div>

        <!-- Form Registrazione -->
        <form id="register-form" onsubmit="handleRegisterSubmit(event)">
          
          <!-- SELETTORE RUOLO -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-uppercase" id="lbl-role">Tipologia Account</label>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-dark rounded-0 flex-grow-1 fw-bold small text-uppercase py-2" id="btn-role-customer" onclick="setRole('customer')">
                <i class="bi bi-person me-1"></i> <span id="txt-role-customer">CLIENTE</span>
              </button>
              <button type="button" class="btn btn-outline-dark rounded-0 flex-grow-1 fw-bold small text-uppercase py-2" id="btn-role-restaurant" onclick="setRole('restaurant')">
                <i class="bi bi-shop me-1"></i> <span id="txt-role-restaurant">RISTORANTE</span>
              </button>
            </div>
          </div>

          <!-- NOME UTENTE / REFERENTE -->
          <div class="mb-3">
            <label for="name" class="form-label small fw-bold text-uppercase" id="lbl-name">Nome Completo</label>
            <input type="text" class="form-control rounded-0 border-dark shadow-none" id="name" required placeholder="Mario Rossi">
          </div>

          <!-- COGNOME -->
          <div class="mb-3">
            <label for="surname" class="form-label small fw-bold text-uppercase" id="lbl-surname">Cognome</label>
            <input type="text" class="form-control rounded-0 border-dark shadow-none" id="surname" required placeholder="Rossi">
          </div>

          <!-- EMAIL -->
          <div class="mb-3">
            <label for="email" class="form-label small fw-bold text-uppercase" id="lbl-email">Indirizzo Email</label>
            <input type="email" class="form-control rounded-0 border-dark shadow-none" id="email" required placeholder="nome@esempio.it">
          </div>

          <!-- PASSWORD CON TASTO MOSTRA/NASCONDI -->
          <div class="mb-3">
            <label for="password" class="form-label small fw-bold text-uppercase" id="lbl-password">Password (min. 6 caratteri)</label>
            <div class="input-group">
              <input type="password" class="form-control rounded-0 border-dark shadow-none" id="password" required placeholder="••••••••" minlength="6">
              <button class="btn btn-outline-dark rounded-0 border-dark px-3" type="button" id="btn-toggle-password" onclick="togglePasswordVisibility('password', 'pwd-icon')">
                <i class="bi bi-eye" id="pwd-icon"></i>
              </button>
            </div>
          </div>

          <!-- CAMPI CLIENTE -->
          <div id="customer-fields" class="mb-4">
            <label for="favoriteCategory" class="form-label small fw-bold text-uppercase" id="lbl-fav-cat">Piatto/Cucina Preferita</label>
            <select id="favoriteCategory" class="form-select rounded-0 border-dark shadow-none mb-3">
              <option value="" id="opt-fav-none">Nessuna preferenza specifica</option>
              <!-- Le categorie reali vengono caricate dinamicamente dal backend (GET /api/meals/categories) -->
            </select>

            <label for="paymentMethod" class="form-label small fw-bold text-uppercase" id="lbl-payment-method">Metodo di Pagamento Preferito</label>
            <select id="paymentMethod" class="form-select rounded-0 border-dark shadow-none">
              <option value="carta_credito">Carta di credito</option>
              <option value="carta_prepagata">Carta prepagata</option>
              <option value="contanti">Contanti</option>
            </select>
          </div>

          <!-- CAMPI RISTORANTE -->
          <div id="restaurant-fields" class="d-none">
            <div class="mb-3">
              <label for="restaurantName" class="form-label small fw-bold text-uppercase" id="lbl-rest-name">Nome del Locale / Ristorante</label>
              <input type="text" class="form-control rounded-0 border-dark shadow-none" id="restaurantName" placeholder="Es. Pizzeria Da Francesco">
            </div>

            <div class="mb-3">
              <label for="restaurantAddress" class="form-label small fw-bold text-uppercase" id="lbl-rest-addr">Indirizzo Ritiro Asporto</label>
              <input type="text" class="form-control rounded-0 border-dark shadow-none" id="restaurantAddress" placeholder="Es. Via Roma 12, Milano">
            </div>

            <div class="mb-3">
              <label for="restaurantPhone" class="form-label small fw-bold text-uppercase" id="lbl-rest-phone">Recapito Telefonico</label>
              <input type="tel" class="form-control rounded-0 border-dark shadow-none" id="restaurantPhone" placeholder="Es. 02 1234567">
            </div>

            <div class="mb-4">
              <label for="IVAnumber" class="form-label small fw-bold text-uppercase" id="lbl-iva">Partita IVA</label>
              <input type="text" class="form-control rounded-0 border-dark shadow-none" id="IVAnumber" placeholder="Es. IT12345678901">
            </div>
          </div>

          <button type="submit" class="btn btn-dark rounded-0 w-100 py-3 fw-bold text-uppercase" style="font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.05em;" id="btn-submit-register">
            CREA ACCOUNT
          </button>
        </form>

        <div class="text-center border-top mt-4 pt-3">
          <p class="small text-muted mb-2" id="txt-have-account">Hai già un account registrato?</p>
          <a href="login.html" class="small fw-bold text-dark text-uppercase text-decoration-underline" id="txt-go-login">
            ACCEDI QUI &rarr;
          </a>
        </div>

      </div>
    </main>

    <!-- Componenti Comuni Iniettati da utils.js -->
    <div id="app-footer"></div>
    <div id="app-drawer"></div>
    <div id="app-modals"></div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
