<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFood // Profilo Utente</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <!-- Header Iniettato da utils.js -->
    <div id="app-header"></div>

    <!-- CONTENUTO PROFILO -->
    <main class="container py-5" style="max-width: 680px; min-height: 65vh;">
      
      <!-- SCHEDA 1: DATI ANAGRAFICI + PREFERENZE -->
      <div class="border border-dark p-4 p-md-5 bg-white mb-4">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
          <div>
            <span class="badge bg-black rounded-0 text-uppercase py-1 px-2 mb-2" id="txt-badge-profile">AREA PERSONALE</span>
            <h3 class="fw-bold text-uppercase m-0" style="font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em;" id="txt-profile-title">
              GESTISCI PROFILO
            </h3>
          </div>
          <span id="user-role-badge" class="badge bg-secondary rounded-0 text-uppercase px-3 py-2">...</span>
        </div>

        <div id="profile-alert" class="alert rounded-0 small d-none py-2 px-3 mb-4"></div>

        <form id="profile-form" onsubmit="handleProfileUpdate(event)">
          <div class="mb-3">
            <label for="name" class="form-label small fw-bold text-uppercase" id="lbl-name">Nome Completo / Referente</label>
            <input type="text" class="form-control rounded-0 border-dark shadow-none" id="name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label small fw-bold text-uppercase" id="lbl-email">Indirizzo Email</label>
            <input type="email" class="form-control rounded-0 border-dark shadow-none" id="email" required>
          </div>

          <!-- Solo Clienti: preferenza cucina + metodo di pagamento -->
          <div id="customer-profile-fields" class="mb-4 d-none">
            <label for="favoriteCategory" class="form-label small fw-bold text-uppercase" id="lbl-fav-cat">Piatto/Cucina Preferita (Bacheca)</label>
            <select id="favoriteCategory" class="form-select rounded-0 border-dark shadow-none mb-3">
              <option value="" id="opt-fav-none">Nessuna preferenza specifica</option>
              <!-- Le categorie reali vengono caricate dinamicamente dal backend -->
            </select>

            <label for="paymentMethod" class="form-label small fw-bold text-uppercase" id="lbl-payment-method">Metodo di Pagamento Preferito</label>
            <select id="paymentMethod" class="form-select rounded-0 border-dark shadow-none">
              <option value="carta_credito">Carta di credito</option>
              <option value="carta_prepagata">Carta prepagata</option>
              <option value="contanti">Contanti</option>
            </select>
          </div>

          <!-- Solo Ristoranti -->
          <div id="restaurant-profile-fields" class="d-none">
            <div class="mb-3">
              <label for="restaurantName" class="form-label small fw-bold text-uppercase" id="lbl-rest-name">Nome del Locale / Ristorante</label>
              <input type="text" class="form-control rounded-0 border-dark shadow-none" id="restaurantName">
            </div>

            <div class="mb-3">
              <label for="restaurantAddress" class="form-label small fw-bold text-uppercase" id="lbl-rest-addr">Indirizzo Ritiro Asporto</label>
              <input type="text" class="form-control rounded-0 border-dark shadow-none" id="restaurantAddress">
            </div>

            <div class="mb-3">
              <label for="restaurantPhone" class="form-label small fw-bold text-uppercase" id="lbl-rest-phone">Recapito Telefonico</label>
              <input type="tel" class="form-control rounded-0 border-dark shadow-none" id="restaurantPhone">
            </div>

            <div class="mb-4">
              <label for="IVAnumber" class="form-label small fw-bold text-uppercase" id="lbl-iva">Partita IVA</label>
              <input type="text" class="form-control rounded-0 border-dark shadow-none" id="IVAnumber">
            </div>
          </div>

          <button type="submit" class="btn btn-dark rounded-0 w-100 py-3 fw-bold text-uppercase" style="font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.05em;" id="btn-save-profile">
            SALVA MODIFICHE
          </button>
        </form>
      </div>

      <!-- SCHEDA 2: SICUREZZA / PASSWORD -->
      <div class="border border-dark p-4 p-md-5 bg-white mb-4">
        <h5 class="fw-bold text-uppercase mb-3" style="font-family: 'Space Grotesk', sans-serif;" id="txt-pwd-title">
          SICUREZZA & PASSWORD
        </h5>
        
        <div id="pwd-alert" class="alert rounded-0 small d-none py-2 px-3 mb-3"></div>

        <form id="password-form" onsubmit="handlePasswordUpdate(event)">
          <div class="mb-3">
            <label for="currentPassword" class="form-label small fw-bold text-uppercase" id="lbl-curr-pwd">Password Attuale</label>
            <div class="input-group">
              <input type="password" class="form-control rounded-0 border-dark shadow-none" id="currentPassword" required placeholder="••••••••">
              <button class="btn btn-outline-dark rounded-0 border-dark px-3" type="button" onclick="togglePasswordVisibility('currentPassword', 'icon-curr')">
                <i class="bi bi-eye" id="icon-curr"></i>
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label for="newPassword" class="form-label small fw-bold text-uppercase" id="lbl-new-pwd">Nuova Password (min. 6 caratteri)</label>
            <div class="input-group">
              <input type="password" class="form-control rounded-0 border-dark shadow-none" id="newPassword" required placeholder="••••••••" minlength="6">
              <button class="btn btn-outline-dark rounded-0 border-dark px-3" type="button" onclick="togglePasswordVisibility('newPassword', 'icon-new')">
                <i class="bi bi-eye" id="icon-new"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-outline-dark rounded-0 w-100 py-3 fw-bold text-uppercase" style="font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.05em;" id="btn-save-pwd">
            AGGIORNA PASSWORD
          </button>
        </form>
      </div>

      <!-- SCHEDA 3: ZONA PERICOLOSA / ELIMINA ACCOUNT -->
      <div class="border border-danger p-4 p-md-5 bg-white">
        <h5 class="fw-bold text-uppercase mb-2 text-danger" style="font-family: 'Space Grotesk', sans-serif;" id="txt-danger-title">
          ZONA PERICOLOSA
        </h5>
        <p class="small text-muted mb-3" id="txt-danger-sub">
          Eliminando l'account perderai definitivamente l'accesso e tutti i dati associati (ordini, preferenze, menu). L'operazione non è reversibile.
        </p>

        <div id="delete-alert" class="alert rounded-0 small d-none py-2 px-3 mb-3"></div>

        <!-- Passo 1: pulsante che apre la richiesta di conferma -->
        <button type="button" class="btn btn-outline-danger rounded-0 w-100 py-3 fw-bold text-uppercase" id="btn-delete-account-start" onclick="showDeleteConfirmation()">
          ELIMINA IL MIO ACCOUNT
        </button>

        <!-- Passo 2: box di conferma, nascosto finché non si clicca sopra -->
        <div id="delete-confirm-box" class="d-none mt-3 p-3 border border-danger bg-light">
          <p class="small fw-bold mb-2" id="txt-danger-confirm-label">
            Digita ELIMINA per confermare la cancellazione definitiva dell'account:
          </p>
          <input type="text" class="form-control rounded-0 border-dark shadow-none mb-3" id="delete-confirm-input" placeholder="ELIMINA">
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-danger rounded-0 flex-grow-1 fw-bold text-uppercase" id="btn-delete-account-confirm" onclick="handleDeleteAccount()">
              CONFERMA ELIMINAZIONE
            </button>
            <button type="button" class="btn btn-outline-dark rounded-0 px-3 fw-bold text-uppercase" onclick="hideDeleteConfirmation()">
              ANNULLA
            </button>
          </div>
        </div>
      </div>

    </main>

    <!-- Componenti Comuni Iniettati da utils.js -->
    <div id="app-footer"></div>
    <div id="app-drawer"></div>
    <div id="app-modals"></div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
