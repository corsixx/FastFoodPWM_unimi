<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFood // Catalogo Completo</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <!-- Header Iniettato da utils.js -->
    <div id="app-header"></div>

    <!-- Barra Categorie Trascinabile -->
    <div class="categories-bar-wrapper">
      <nav class="categories-scroll-container" id="categories-nav">
        <button class="nav-category-link active" onclick="filterCategory('', this)" id="btn-cat-all">ALL / TUTTO</button>
      </nav>
    </div>

    <!-- CONTENUTO CATALOGO -->
    <main class="container-fluid px-3 px-md-4 py-4" style="min-height: 75vh;">

      <!-- Banner Filtro Ristorante Attivo (se presente in query string) -->
      <div id="restaurant-filter-banner" class="alert alert-dark rounded-0 d-flex justify-content-between align-items-center mb-4 py-2 px-3 d-none">
        <div class="small">
          <i class="bi bi-shop me-1"></i> <span id="txt-rest-filter-label">Menu del locale:</span> <strong id="filtered-restaurant-name">Partner</strong>
        </div>
        <button type="button" class="btn btn-outline-light btn-sm rounded-0 fw-bold text-uppercase py-0 px-2" onclick="resetRestaurantFilter()" id="btn-reset-rest-filter">
          Mostra Tutto il Menu &times;
        </button>
      </div>

      <!-- Intestazione Catalogo, Ricerca e Ordinamento -->
      <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 border-bottom pb-4 mb-4">
        <div>
          <span class="badge bg-black rounded-0 text-uppercase py-1 px-2 mb-1" id="txt-badge-catalog">CATALOGO COMPLETO</span>
          <h2 class="fw-bold text-uppercase m-0" style="font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em;" id="txt-catalog-title">
            MENU COMPLETO
          </h2>
          <div class="small text-muted" id="results-count">Caricamento piatti in corso...</div>
        </div>

        <!-- Filtri: Ricerca + Dropdown Ordinamento -->
        <div class="d-flex flex-column flex-sm-row gap-2" style="max-width: 540px; width: 100%;">
          <div class="input-group">
            <span class="input-group-text bg-white border-dark rounded-0"><i class="bi bi-search"></i></span>
            <input type="text" id="search-input" class="form-control border-dark rounded-0 shadow-none" placeholder="Cerca piatto o ingrediente..." oninput="handleSearchInput(event)">
          </div>

          <select class="form-select border-dark rounded-0 shadow-none" style="min-width: 180px;" onchange="handleSort(this.value)" id="sort-select">
            <option value="default" id="opt-sort-default">Ordina: Predefinito</option>
            <option value="price-asc" id="opt-sort-price-asc">Prezzo: Crescente</option>
            <option value="price-desc" id="opt-sort-price-desc">Prezzo: Decrescente</option>
            <option value="time-asc" id="opt-sort-time">Tempo preparazione</option>
            <option value="name-asc" id="opt-sort-name">Nome (A - Z)</option>
          </select>
        </div>
      </div>

      <!-- Griglia Piatti (8 elementi per pagina) -->
      <div class="row g-3 g-md-4" id="catalog-grid">
        <div class="col-12 text-center py-5 text-muted small">
          <div class="spinner-border spinner-border-sm me-2"></div>Caricamento catalogo in corso...
        </div>
      </div>

      <!-- CONTROLLO PAGINAZIONE CON FRECCETTE -->
      <div class="d-flex justify-content-center align-items-center mt-5" id="pagination-wrapper">
        <div class="pagination-minimal" id="pagination-controls"></div>
      </div>

    </main>

    <!-- Componenti Comuni Iniettati da utils.js -->
    <div id="app-footer"></div>
    <div id="app-drawer"></div>
    <div id="app-modals"></div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/catalog.js"></script>
  </body>
</html>
